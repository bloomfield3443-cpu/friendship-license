<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friendship License</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #080808;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }

    .card {
        width: 100%;
        max-width: 430px;
        background: linear-gradient(145deg, #171717, #090909);
        border: 1px solid #b99a55;
        border-radius: 22px;
        padding: 28px 22px;
        box-shadow: 0 0 35px rgba(212, 175, 55, 0.18);
        text-align: center;
    }

    .top-line {
        width: 70px;
        height: 3px;
        background: #d4af37;
        margin: 0 auto 15px;
        border-radius: 10px;
    }

    h1 {
        color: #d4af37;
        font-size: 28px;
        letter-spacing: 2px;
        margin-bottom: 7px;
    }

    .subtitle {
        color: #aaa;
        font-size: 12px;
        letter-spacing: 3px;
        margin-bottom: 22px;
    }

    .photo-frame {
        width: 190px;
        height: 190px;
        margin: auto;
        border-radius: 50%;
        padding: 5px;
        border: 2px solid #d4af37;
        background: #111;
        overflow: hidden;
    }

    .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    .names {
        margin-top: 22px;
        font-size: 22px;
        font-weight: bold;
        color: white;
    }

    .heart {
        color: #d4af37;
        font-size: 20px;
        margin: 5px 0;
    }

    .info {
        margin-top: 22px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .info-box {
        background: #111;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 13px 7px;
    }

    .label {
        color: #999;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    .value {
        color: #d4af37;
        font-size: 15px;
        font-weight: bold;
    }

    .message {
        margin: 22px 0;
        padding: 18px 12px;
        border-top: 1px solid #765f2d;
        border-bottom: 1px solid #765f2d;
        color: #ddd;
        font-style: italic;
        line-height: 1.5;
    }

    .verified {
        display: inline-block;
        padding: 9px 20px;
        border: 1px solid #d4af37;
        border-radius: 30px;
        color: #d4af37;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1.5px;
    }

    .footer {
        margin-top: 20px;
        color: #777;
        font-size: 10px;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<div class="card">

    <div class="top-line"></div>

    <h1>FRIENDSHIP LICENSE</h1>

    <div class="subtitle">
        OFFICIAL FRIENDSHIP RECORD
    </div>

    <div class="photo-frame">
        <img src="friends.jpg" alt="Ahmed Nawaz and Ubaidullah">
    </div>

    <div class="names">
        Ahmed Nawaz
        <div class="heart">♥</div>
        Ubaidullah (Baidi)
    </div>

    <div class="info">

        <div class="info-box">
            <div class="label">Friends Since</div>
            <div class="value">2016</div>
        </div>

        <div class="info-box">
            <div class="label">License Type</div>
            <div class="value">Lifetime</div>
        </div>

        <div class="info-box">
            <div class="label">Validity</div>
            <div class="value">Forever</div>
        </div>

        <div class="info-box">
            <div class="label">Status</div>
            <div class="value">Active</div>
        </div>

    </div>

    <div class="message">
        "Friends Today, Brothers Forever."
    </div>

    <div class="verified">
        ✓ FRIENDSHIP VERIFIED
    </div>

    <div class="footer">
        THIS FRIENDSHIP IS OFFICIALLY LICENSED
    </div>

</div>

</body>
</html>
